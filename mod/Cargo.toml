[package]
name = "occultism"
version = "0.12.2-alpha.1"
license = "MIT"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# The SDK of the build horizon-mod.toml's [native] horizon pins: any cargo horizon-mod command
# fetches it into .horizon/sdk/ (the only form the launcher takes).
[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

